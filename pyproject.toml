[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "growth_review"
version = "0.1.0"
description = "Growth-rate review: compiled fsigma8 / BAO / S8 measurements, forecasts and theory curves, with plotting"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Corentin Ravoux" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "astropy",
]

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["jupyter"]

[project.scripts]
growth-review-figures = "growth_review.figures:main"

[tool.setuptools.packages.find]
include = ["growth_review*"]

[tool.setuptools.package-data]
growth_review = ["data/**/*.txt", "data/**/*.csv", "data/**/*.ecsv", "data/**/*.md", "*.mplstyle"]
